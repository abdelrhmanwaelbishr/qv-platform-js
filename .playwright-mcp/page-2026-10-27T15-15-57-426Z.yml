    - generic [ref=f2e11]:
      - heading "Know where you stand." [level=1] [ref=f2e12]
      - paragraph [ref=f2e13]: "QAWIM is a quiet, structured way to take stock of your life: what you carry, where you are stuck, and the next honest step. No streak counters and no cheerleading."
      - generic [ref=f2e14]:
        - link "Start with an honest look" [ref=f2e15] [cursor=pointer]:
          - /url: /sign-up
        - link "Sign in" [ref=f2e16] [cursor=pointer]:
          - /url: /sign-in
      - paragraph [ref=f2e17]: Early release. Accounts, the four questions and your profile are live. Activity logging is still being ported from the Python backend.
    - generic [ref=f2e18]:
      - heading "Four questions, asked in order." [level=2] [ref=f2e19]
      - paragraph [ref=f2e20]: Most plans fail because they begin at the last question, how. QAWIM begins with what is actually there.
      - list [ref=f2e21]:
        - listitem [ref=f2e22]:
          - generic [ref=f2e23]: "01"
          - heading "Who you are" [level=3] [ref=f2e24]
          - paragraph [ref=f2e25]: Not a personality quiz. A record of what you have actually done, kept long enough to show a pattern instead of a mood.
        - listitem [ref=f2e26]:
          - generic [ref=f2e27]: "02"
          - heading "Where you stand" [level=3] [ref=f2e28]
          - paragraph [ref=f2e29]: You describe the problem in your own words. QAWIM asks the questions that turn a vague ache into something you can work on.
        - listitem [ref=f2e30]:
          - generic [ref=f2e31]: "03"
          - heading "What you want" [level=3] [ref=f2e32]
          - paragraph [ref=f2e33]: Goals small enough to start this week, with success criteria you can check rather than guess at.
        - listitem [ref=f2e34]:
          - generic [ref=f2e35]: "04"
          - heading "How you move" [level=3] [ref=f2e36]
          - paragraph [ref=f2e37]: Every step gets written down. What worked and what did not changes the next step, not the whole plan.
    - generic [ref=f2e39]:
      - generic [ref=f2e40]:
