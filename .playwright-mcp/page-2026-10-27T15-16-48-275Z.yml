    - generic [ref=f3e11]:
      - heading "Know where you stand." [level=1] [ref=f3e12]
      - paragraph [ref=f3e13]: "QAWIM is a quiet, structured way to take stock of your life: what you carry, where you are stuck, and the next honest step. No streak counters and no cheerleading."
      - generic [ref=f3e14]:
        - link "Start with an honest look" [ref=f3e15] [cursor=pointer]:
          - /url: /sign-up
        - link "Sign in" [ref=f3e16] [cursor=pointer]:
          - /url: /sign-in
      - paragraph [ref=f3e17]: Early release. Accounts, the four questions and your profile are live. Activity logging is still being ported from the Python backend.
    - generic [ref=f3e18]:
      - heading "Four questions, asked in order." [level=2] [ref=f3e19]
      - paragraph [ref=f3e20]: Most plans fail because they begin at the last question, how. QAWIM begins with what is actually there.
      - list [ref=f3e21]:
        - listitem [ref=f3e22]:
          - generic [ref=f3e23]: "01"
          - heading "Who you are" [level=3] [ref=f3e24]
          - paragraph [ref=f3e25]: Not a personality quiz. A record of what you have actually done, kept long enough to show a pattern instead of a mood.
        - listitem [ref=f3e26]:
          - generic [ref=f3e27]: "02"
          - heading "Where you stand" [level=3] [ref=f3e28]
          - paragraph [ref=f3e29]: You describe the problem in your own words. QAWIM asks the questions that turn a vague ache into something you can work on.
        - listitem [ref=f3e30]:
          - generic [ref=f3e31]: "03"
          - heading "What you want" [level=3] [ref=f3e32]
          - paragraph [ref=f3e33]: Goals small enough to start this week, with success criteria you can check rather than guess at.
        - listitem [ref=f3e34]:
          - generic [ref=f3e35]: "04"
          - heading "How you move" [level=3] [ref=f3e36]
          - paragraph [ref=f3e37]: Every step gets written down. What worked and what did not changes the next step, not the whole plan.
    - generic [ref=f3e39]:
      - generic [ref=f3e40]:
        - heading "A page from someone’s week." [level=2] [ref=f3e41]
        - paragraph [ref=f3e42]: An entry is a few sentences and one decision. Written by hand, read once a week, kept for the pattern it makes.
