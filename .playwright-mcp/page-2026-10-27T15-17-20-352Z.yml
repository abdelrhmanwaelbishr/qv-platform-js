      - heading "Know where you stand." [level=1] [ref=f5e10]
      - paragraph [ref=f5e11]: "QAWIM is a quiet, structured way to take stock of your life: what you carry, where you are stuck, and the next honest step. No streak counters and no cheerleading."
      - generic [ref=f5e12]:
        - link "Start with an honest look" [ref=f5e13] [cursor=pointer]:
          - /url: /sign-up
        - link "Sign in" [ref=f5e14] [cursor=pointer]:
          - /url: /sign-in
      - paragraph [ref=f5e15]: Early release. Accounts, the four questions and your profile are live. Activity logging is still being ported from the Python backend.
    - generic [ref=f5e16]:
      - heading "Four questions, asked in order." [level=2] [ref=f5e17]
      - paragraph [ref=f5e18]: Most plans fail because they begin at the last question, how. QAWIM begins with what is actually there.
      - list [ref=f5e19]:
        - listitem [ref=f5e20]:
          - generic [ref=f5e21]: "01"
          - heading "Who you are" [level=3] [ref=f5e22]
          - paragraph [ref=f5e23]: Not a personality quiz. A record of what you have actually done, kept long enough to show a pattern instead of a mood.
        - listitem [ref=f5e24]:
          - generic [ref=f5e25]: "02"
          - heading "Where you stand" [level=3] [ref=f5e26]
          - paragraph [ref=f5e27]: You describe the problem in your own words. QAWIM asks the questions that turn a vague ache into something you can work on.
        - listitem [ref=f5e28]:
          - generic [ref=f5e29]: "03"
          - heading "What you want" [level=3] [ref=f5e30]
          - paragraph [ref=f5e31]: Goals small enough to start this week, with success criteria you can check rather than guess at.
        - listitem [ref=f5e32]:
          - generic [ref=f5e33]: "04"
          - heading "How you move" [level=3] [ref=f5e34]
          - paragraph [ref=f5e35]: Every step gets written down. What worked and what did not changes the next step, not the whole plan.
    - generic [ref=f5e37]:
